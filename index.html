<!doctype html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Klippbordet</title>
<style>
  :root{
    --bg-0:#030f16;
    --bg-1:#06202b;
    --teal:#0fb8ac;
    --teal-bright:#3ce8d8;
    --text:#f2fbfa;
    --muted:#9fc9c6;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;
    min-height:100vh;
    background:linear-gradient(180deg, var(--bg-0) 0%, var(--bg-1) 100%);
    color:var(--text);
    font-family:"Segoe UI", Arial, Helvetica, sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    text-align:center;
    padding:2rem;
  }
  h1{
    font-size:clamp(2rem, 6vw, 3.5rem);
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--teal-bright);
    text-shadow:0 0 18px rgba(60,232,216,0.45);
    margin:0 0 0.6rem;
  }
  p{ color:var(--muted); font-size:1.1rem; margin:0; }
</style>
</head>
<body>
  <div>
    <h1>Klippbordet</h1>
    <p>Redigeringsappen byggs här. Platshållarsida tills vidare.</p>
  </div>
</body>
</html>
